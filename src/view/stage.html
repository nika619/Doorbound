<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marquee stage</title>
    <style>
      :root {
        --ink: #fff8ec;
        --dim: #c9bfae;
        --bg0: #14101c;
        --bg1: #2a1d3a;
        --accent: #ffc857;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(120% 90% at 50% 10%, var(--bg1), var(--bg0));
        color: var(--ink);
        font-family: ui-rounded, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      /* 5% safe area on every side: TVs crop the edges. */
      main {
        height: 100%;
        padding: 5vmin;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
        gap: 2.4vmin;
      }
      #eyebrow { font-size: clamp(14px, 3vmin, 40px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); min-height: 1.2em; }
      #headline { font-size: clamp(28px, 11vmin, 190px); line-height: 1.02; font-weight: 800; text-wrap: balance; max-width: 16ch; }
      #subline { font-size: clamp(16px, 4.2vmin, 64px); color: var(--dim); text-wrap: balance; }
      #count { position: relative; width: min(62vmin, 80vw); aspect-ratio: 1; }
      #count svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      #count circle { fill: none; stroke-width: 5; }
      #track { stroke: #ffffff22; }
      #ring { stroke: var(--accent); stroke-linecap: round; }
      #digits { position: absolute; inset: 0; display: grid; place-content: center; font-size: clamp(32px, 19vmin, 300px); font-weight: 800; font-variant-numeric: tabular-nums; }
      #score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 5vmin; width: min(90vw, 160vmin); }
      .side { display: grid; gap: 1vmin; }
      .name { font-size: clamp(16px, 5vmin, 80px); color: var(--dim); overflow-wrap: anywhere; }
      .pts { font-size: clamp(40px, 26vmin, 420px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
      .dash { font-size: clamp(24px, 12vmin, 180px); color: var(--accent); }
      [hidden] { display: none !important; }
      body.paused main { opacity: 0.55; }
      #toggle {
        position: fixed; right: 5vmin; bottom: 5vmin;
        min-width: 48px; min-height: 48px; padding: 0 18px;
        border: 2px solid #ffffff55; border-radius: 999px;
        background: #00000055; color: var(--ink); font: inherit; font-size: 18px;
      }
      @media (prefers-reduced-motion: no-preference) {
        main { transition: opacity 0.3s; }
        #headline, #subline, #count, #score { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(3vmin); } }
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-live="polite">
      <p id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p id="subline"></p>
      <div id="count" hidden>
        <svg viewBox="0 0 100 100" role="img" aria-label="Countdown ring">
          <circle id="track" cx="50" cy="50" r="46" />
          <circle id="ring" cx="50" cy="50" r="46" pathLength="1" stroke-dasharray="1" />
        </svg>
        <div id="digits"></div>
      </div>
      <div id="score" hidden>
        <div class="side"><div class="name" id="home"></div><div class="pts" id="homePts"></div></div>
        <div class="dash" aria-hidden="true">–</div>
        <div class="side"><div class="name" id="away"></div><div class="pts" id="awayPts"></div></div>
      </div>
    </main>
    <button id="toggle" hidden>Pause</button>
    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
