<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Departures</title>
<style>
/*FONTS*/
:root {
  --page: #07080a; --board: #0d0f12; --cell: #191c21; --cell-blank: #13161a; --raise: #1f2329; --rule: #22262d;
  --ink: #f4f0e7; --dim: #8b909a; --amber: #ffb547; --go: #7fd8a4; --late: #ff6b4a; --alexa: #31c6f4;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--page); color: var(--ink); overflow: hidden; font-family: var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- the board: drawn at 1920x1080 and scaled to the screen ---------- */
.board { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--board); padding: 60px 72px 48px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 28px; }
.head { display: grid; grid-template-columns: 1fr auto; align-items: end; padding-bottom: 24px; border-bottom: 2px solid var(--rule); }
.eyebrow { font: 700 26px/1 var(--cond); letter-spacing: .22em; color: var(--amber); display: flex; align-items: center; gap: 14px; }
.eyebrow svg { width: 34px; height: 34px; fill: currentColor; }
.title { font: 700 84px/1 var(--cond); margin-top: 14px; }
.when { display: flex; align-items: end; gap: 48px; }
.gate { text-align: right; }
.gate .k { font: 700 22px/1 var(--cond); letter-spacing: .2em; color: var(--dim); }
.gate .v { font: 700 56px/1 var(--cond); margin-top: 10px; font-variant-numeric: tabular-nums; }
.gate .v b { color: var(--amber); font-weight: 700; }
.clock { font: 700 150px/.8 var(--cond); font-variant-numeric: tabular-nums; }

.cols, .row { display: grid; grid-template-columns: 270px 600px 1fr 360px 150px 132px; align-items: center; column-gap: 24px; }
.cols { font: 700 21px/1 var(--cond); letter-spacing: .2em; color: var(--dim); padding-bottom: 14px; }
.cols .r, .row .ready { text-align: right; }
.rows { list-style: none; }
.row { height: 112px; border-top: 2px solid var(--rule); contain: layout paint; }
.row .name { font: 700 54px/1 var(--cond); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .then { font: 500 32px/1.1 var(--body); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ready { font: 700 54px/1 var(--cond); font-variant-numeric: tabular-nums; }
.row .ready.late { color: var(--late); }
.done { height: 64px; border-radius: 12px; border: 2px solid #3a3f48; background: transparent; font: 700 22px/1 var(--cond); letter-spacing: .14em; transition: background-color .2s, border-color .2s; }
.done:hover, .done:focus-visible { border-color: var(--ink); outline: none; }
.done.arm { background: var(--go); border-color: var(--go); color: #0d0f12; }

/* split-flap cells: each character is its own flap */
.flap { display: inline-flex; gap: 4px; font: 700 42px/1 var(--cond); }
.cell { position: relative; width: 33px; height: 56px; background: var(--cell); border-radius: 5px; display: grid; place-items: center; overflow: hidden; perspective: 260px; }
.cell.blank { background: var(--cell-blank); }
.cell::after { content: ''; position: absolute; inset: 50% 0 auto; height: 2px; background: #06070900; box-shadow: 0 0 0 1px #050608; }
.ch { grid-area: 1 / 1; }
.ch.in { animation: flapIn .34s var(--ease) both; transform-origin: 50% 0; }
@keyframes flapIn { from { transform: rotateX(82deg); opacity: .15; } }
.flap[data-tone='ok'] .ch { color: var(--go); }
.flap[data-tone='board'] .ch { color: var(--amber); }
.flap[data-tone='late'] .ch { color: var(--late); }
.flap[data-tone='late'] .cell { background: #2a1916; }
.flap[data-tone='done'] .ch { color: var(--dim); }

/* ---------- runway ---------- */
.runway { align-self: end; }
.rw-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; gap: 40px; }
.rw-head .k { font: 700 21px/1 var(--cond); letter-spacing: .2em; color: var(--dim); }
.rw-head .learned { font: 500 24px/1.2 var(--body); color: var(--dim); text-align: right; }
.rw-head .learned b { color: var(--ink); font-weight: 500; }
.lanes { position: relative; height: 210px; }
.lane-name { position: absolute; left: 0; width: 120px; height: 50px; font: 700 23px/50px var(--cond); letter-spacing: .12em; color: var(--dim); overflow: hidden; }
.layer { position: absolute; inset: 0 0 0 130px; }
.blk { position: absolute; left: 0; top: 0; height: 50px; border-radius: 8px; background: var(--raise); border: 1px solid #2c3139; padding: 0 14px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font: 500 21px/1 var(--body); contain: layout paint; transition: background-color .5s, border-color .5s, opacity .5s; }
.blk.done { opacity: .34; }
.blk.current { background: #2a2920; border-color: var(--amber); }
.blk.overrun { border-color: var(--late); }
.blk.over { background: repeating-linear-gradient(135deg, #3a1d18 0 10px, #2a1714 10px 20px); border-color: var(--late); }
.blk.moved { background: #172a20; border-color: var(--go); }
.blk.later { opacity: .55; border-style: dashed; }
.blk i { margin-left: auto; padding-left: 10px; font: 700 16px/1 var(--cond); font-style: normal; letter-spacing: .14em; color: var(--amber); }
.now { position: absolute; top: -14px; bottom: -12px; left: 0; width: 3px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 6px #f4f0e70f; will-change: transform; }
.gateline { position: absolute; top: -14px; bottom: -40px; left: 0; border-left: 3px dashed var(--amber); }
.gateline span { position: absolute; bottom: 0; left: 10px; font: 700 19px/1 var(--cond); letter-spacing: .16em; color: var(--amber); white-space: nowrap; }
.tick { position: absolute; bottom: -38px; font: 500 18px/1 var(--body); color: var(--dim); transform: translateX(-50%); }

/* ---------- footer ---------- */
.foot { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.msg { display: flex; align-items: center; gap: 18px; font: 500 28px/1.25 var(--body); color: var(--dim); }
.msg .dot { width: 16px; height: 16px; border-radius: 50%; background: #2c3139; flex: none; }
.foot .tag { font: 700 18px/1 var(--cond); letter-spacing: .16em; color: var(--dim); white-space: nowrap; }
.reroute { flex: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 26px; align-items: center; padding: 16px 22px; background: #15171b; border: 2px solid var(--amber); border-radius: 14px; animation: rise .55s var(--ease) both; }
.reroute .k { font: 700 28px/1 var(--cond); letter-spacing: .2em; color: var(--amber); }
.reroute .chips { display: flex; flex-wrap: wrap; gap: 10px 22px; font: 500 26px/1.25 var(--body); }
.reroute .chips span::before { content: '→ '; color: var(--go); }
.reroute.stuck { border-color: var(--late); }
.reroute.stuck .k { color: var(--late); }
.undo { height: 56px; padding: 0 22px; border-radius: 12px; border: 2px solid #3a3f48; background: transparent; font: 700 21px/1 var(--cond); letter-spacing: .14em; }
.undo:hover, .undo:focus-visible { border-color: var(--ink); outline: none; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

/* fixed rows so a hidden section never hands its space to the footer */
.head { grid-row: 1; } #table { grid-row: 2; } .runway, .empty { grid-row: 3; } .foot { grid-row: 4; }

/* ---------- empty states ---------- */
.empty { display: grid; align-content: center; justify-items: start; gap: 26px; padding: 0 8px; }
.empty .big { font: 700 104px/1 var(--cond); }
.empty .say { font: 500 34px/1.35 var(--body); color: var(--dim); max-width: 1300px; }
.empty .say b { color: var(--ink); font-weight: 500; }

/* ---------- inline card ---------- */
.card { position: absolute; inset: 0; padding: 20px 22px; background: var(--board); display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; }
.card .eyebrow { font-size: 15px; gap: 8px; }
.card .eyebrow svg { width: 20px; height: 20px; }
.card .line { font: 700 34px/1.05 var(--cond); }
.card .line b { color: var(--amber); font-weight: 700; }
.card .chips { display: flex; flex-wrap: wrap; gap: 8px; align-content: start; }
.card .chip { padding: 8px 12px; border-radius: 8px; background: var(--cell); font: 700 18px/1 var(--cond); letter-spacing: .1em; }
.card .chip[data-tone='ok'] { color: var(--go); } .card .chip[data-tone='board'] { color: var(--amber); }
.card .chip[data-tone='late'] { color: var(--late); background: #2a1916; } .card .chip[data-tone='done'] { color: var(--dim); }
.card .open { min-height: 48px; border-radius: 10px; border: 2px solid #3a3f48; background: transparent; font: 700 18px/1 var(--cond); letter-spacing: .14em; }

@media (prefers-reduced-motion: reduce) {
  .ch.in, .reroute { animation: none; }
  .blk { transition: none; }
}
</style>
</head>
<body>
<main id="board" class="board" hidden>
  <header class="head">
    <div>
      <div class="eyebrow"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 21 29 12l-1.6-3.4-8.4 2.6-6.6-6.2-2.6.9 3.8 7.3-6.3 2-2.9-2.2-2 .7z"/><rect x="3" y="26" width="26" height="2.4" rx="1.2"/></svg><span id="eyebrow">DEPARTURES</span></div>
      <h1 class="title" id="title">Departures</h1>
    </div>
    <div class="when" id="when" hidden>
      <div class="gate"><div class="k" id="gateK">GATE CLOSES</div><div class="v"><span id="gate">7:40</span> · <b id="left">0 MIN</b></div></div>
      <div class="clock" id="clock" aria-hidden="true">0:00</div>
    </div>
  </header>
  <section id="table" hidden>
    <div class="cols" aria-hidden="true"><span>TRAVELLER</span><span>NOW</span><span>THEN</span><span>STATUS</span><span class="r">READY</span><span></span></div>
    <ul class="rows" id="rows" aria-label="Who is doing what"></ul>
  </section>
  <section class="runway" id="runway" hidden aria-hidden="true">
    <div class="rw-head"><div class="k">RUNWAY</div><div class="learned" id="learned"></div></div>
    <div class="lanes" id="lanes"><div class="layer" id="layer"><div class="gateline" id="gateline"><span id="gatelabel">GATE</span></div><div class="now" id="nowline"></div></div></div>
  </section>
  <section class="empty" id="empty" hidden><div class="big" id="emptyBig"></div><p class="say" id="emptySay"></p></section>
  <footer class="foot" id="foot"><div class="msg" id="msg"><span class="dot"></span><span id="msgText"></span></div><div class="tag" id="tag"></div></footer>
</main>
<section id="card" class="card" hidden aria-label="Departure summary">
  <div class="eyebrow"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 21 29 12l-1.6-3.4-8.4 2.6-6.6-6.2-2.6.9 3.8 7.3-6.3 2-2.9-2.2-2 .7z"/><rect x="3" y="26" width="26" height="2.4" rx="1.2"/></svg><span id="cardEyebrow">DEPARTURES</span></div>
  <div class="line" id="cardLine"></div>
  <div class="chips" id="cardChips"></div>
  <button class="open" id="open" type="button">OPEN THE BOARD</button>
</section>
<div class="sr" id="live" aria-live="polite"></div>
<script>/*SCRIPT*/</script>
</body>
</html>
