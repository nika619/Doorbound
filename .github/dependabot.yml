# Weekly checks for outdated or vulnerable dependencies: npm packages, the CI actions, the base image.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mcp:
        patterns: ["@modelcontextprotocol/*"]
      build-tools:
        patterns: ["esbuild", "typescript", "tsx", "@types/*", "@fontsource/*", "lenis", "playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image stays on a long-term-support Node line; minor and patch updates still come weekly.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
