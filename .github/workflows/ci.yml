name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build, smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No install scripts: nothing in the dependency tree runs or downloads anything.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start the bundled server (demo household, 20x clock)
        run: |
          DEMO_SEED=1 DEMO_SPEED=20 DATA_DIR="$RUNNER_TEMP/data" node dist/server.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3939/healthz && break; sleep 1; done
      - name: End-to-end smoke test over Streamable HTTP
        run: npm run smoke

  docker:
    name: Container builds, refuses unsafe config, passes the smoke test
    runs-on: ubuntu-latest
    env:
      # A throwaway value for this job only; real deployments set their own.
      TOKEN: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker build -t departures .
      - name: Refuses to listen publicly without a token
        run: |
          if docker run --rm departures; then echo "it started without AUTH_TOKEN"; exit 1; fi
      - name: Runs locked down, the way compose.yaml runs it
        run: |
          docker run -d --name departures -p 3939:3939 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 256m \
            -e AUTH_TOKEN="$TOKEN" -e ALLOWED_HOSTS=localhost -e DEMO_SEED=1 departures
          for i in $(seq 1 30); do curl -sf http://localhost:3939/healthz && break; sleep 1; done
      - name: End-to-end smoke test against the container
        run: npm run smoke
        env:
          DOORBOUND_URL: http://localhost:3939
          AUTH_TOKEN: ${{ env.TOKEN }}
      - name: Container logs
        if: failure()
        run: docker logs departures
