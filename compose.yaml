# One household's Doorbound on the internet, with HTTPS:
#   DOMAIN=doorbound.example.com AUTH_TOKEN=$(openssl rand -hex 32) docker compose up -d
# For Alexa+, also set OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET and OAUTH_SIGNING_KEY (each 32+ characters; the
# signing key never leaves this machine, Amazon gets only the client secret) and register the add-on as
# ALEXA.md says: Alexa+ signs in with those (OAuth client credentials) and calls https://$DOMAIN/mcp.
# Caddy fetches and renews the certificate for DOMAIN itself (ports 80 and 443 must reach this machine).
services:
  doorbound:
    build: .
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN, 32 or more characters}
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN to the host name Alexa+ will call}
      SCREEN_KEY: ${SCREEN_KEY:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SIGNING_KEY: ${OAUTH_SIGNING_KEY:-}
      # The family's time zone for a one-household server (IANA, e.g. Asia/Kolkata); linked households pick their own.
      TZ: ${TZ:-}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:-}
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - doorbound-data:/data
    # Nothing but /data is writable, no extra privileges, every capability dropped.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${DOMAIN} --to doorbound:3939
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on: [doorbound]
    restart: unless-stopped
volumes:
  doorbound-data:
  caddy-data:
